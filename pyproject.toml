[project]
name = "nea-demand-forecast-duck-db"
version = "0.1.0"
description = "Nepal (NEA) electricity demand forecasting on a DuckLake lakehouse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "holidays>=0.107",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nepali-datetime>=1.0.8.5",
    "pdfplumber>=0.11.10",
    "playwright>=1.64.1",
    "pymupdf4llm<2",
    "rapidocr-onnxruntime>=1.4.4",
    "statsmodels>=0.15.0",
]

[project.scripts]
nea = "nea_forecast.cli:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nea_forecast"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
